services:
  - type: web
    name: neuralspace
    env: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate
    startCommand: gunicorn neuralspace.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: neuralspace_db
          property: connectionString

databases:
  - name: neuralspace_db
    databaseName: neuralspace
    user: neuralspace_user
    plan: free
